spring:
  application:
    name: fieldops-api
  profiles:
    default: demo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fieldops
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: fieldops
    default-schema: fieldops
    create-schemas: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
fieldops:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
